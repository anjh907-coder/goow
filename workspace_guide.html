            </div>
            <div>
              <input id="regex-input" type="text" value="01012345678" class="w-full rounded-lg border border-emerald-400 bg-emerald-50/20 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <div id="regex-feedback" class="mt-2 text-xs text-emerald-700 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i>
                <span><strong>입력 규칙 통과!</strong> 올바른 10~11자리 휴대폰 번호입니다.</span>
              </div>
            </div>
          </div>
        `;
      } else if (step.interactiveWidget === 'filter') {
        html += `
          <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-slate-800">📊 저절로 늘어나는 FILTER 수식 체험기</h4>
              <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded">자동 확장 (SPILL)</span>
            </div>
            <p class="text-xs text-slate-600">수식: <code>=FILTER({Raw_Data!B2:B, Raw_Data!H2:H, Raw_Data!E2:E, Raw_Data!G2:G}, Raw_Data!D2:D = "일반 참가자")</code></p>
            <div class="overflow-x-auto rounded border border-slate-200 text-xs">
              <table class="w-full text-left">
                <thead class="bg-slate-100 border-b">
                  <tr><th class="p-2">이메일</th><th class="p-2">전화번호</th><th class="p-2">세션</th><th class="p-2">출석</th></tr>
                </thead>
                <tbody>
                  <tr class="bg-emerald-50/60 font-medium border-b"><td class="p-2">kim@test.com</td><td class="p-2">010-9876-5432</td><td class="p-2">A: AI 도구</td><td class="p-2"><span class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">출석 완료</span></td></tr>
                  <tr class="border-b"><td class="p-2">lee@test.com</td><td class="p-2">010-5555-6666</td><td class="p-2">B: 커리어 네트워킹</td><td class="p-2"><span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-[10px]">미체크</span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (step.interactiveWidget === 'mailpreview') {
        html += `
          <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-3">
            <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-paper-plane text-indigo-600"></i>
              Apps Script 개인 맞춤 메일 자동 발송 체험기
            </h4>
            <div class="rounded border border-slate-200 bg-slate-50 p-3 text-xs space-y-2">
              <div class="border-b pb-1 font-mono text-indigo-700 font-semibold">To: minsu.kim@example.com</div>
              <div class="border-b pb-1 font-semibold text-slate-900">제목: [안내] 김민수님, 2026 청년 네트워킹 데이 신청이 완료되었습니다.</div>
              <div class="bg-white p-2.5 rounded border border-slate-200 text-slate-800">
                안녕하세요, 김민수님!<br><br>신청하신 [A: AI 도구] 세션의 접수가 성공적으로 확인되었습니다.<br>행사 당일 뵙겠습니다!<br><br>- 행사 운영팀 드림 -
              </div>
            </div>
          </div>
        `;
      }

      if (step.table) {
        html += `
          <div class="space-y-2">
            <h4 class="text-xs font-bold text-slate-800">📋 ${step.table.title}</h4>
            <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-2xs">
              <table class="w-full border-collapse text-left text-xs">
                <thead>
                  <tr class="bg-slate-100 text-slate-800 font-semibold border-b border-slate-200">
                    ${step.table.headers.map(h => `<th class="px-3.5 py-2.5 whitespace-nowrap">${h}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                  ${step.table.rows.map(r => `
                    <tr class="hover:bg-slate-50/70 transition-colors">
                      ${r.map((c, i) => `<td class="px-3.5 py-2.5 ${i === 0 ? 'font-semibold text-slate-900' : 'text-slate-600'}">${c}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (step.codeBlock) {
        html += `
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-slate-800">💻 ${step.codeBlock.title}</span>
              <span class="text-slate-500 font-mono">${step.codeBlock.language}</span>
            </div>
            <div class="relative overflow-hidden rounded-xl bg-slate-900 text-slate-100 border border-slate-800 shadow-md">
              <div class="flex items-center justify-between border-b border-slate-800 bg-slate-950/70 px-4 py-2 text-xs">
                <span class="font-mono text-slate-400">${step.codeBlock.language === 'javascript' ? 'AppsScript.gs' : 'Formula'}</span>
                <button type="button" id="copy-code-btn" class="flex items-center gap-1.5 rounded bg-slate-800 hover:bg-slate-700 px-2.5 py-1 text-slate-200 font-medium transition-colors">
                  <i class="fa-regular fa-copy text-xs"></i>
                  <span>코드 복사</span>
                </button>
              </div>
              <pre class="overflow-x-auto p-4 text-xs font-mono text-emerald-300 leading-relaxed"><code>${escapeHtml(step.codeBlock.code)}</code></pre>
            </div>
            ${step.codeBlock.explanation ? `<p class="text-xs text-slate-500">💡 <strong>해설:</strong> ${step.codeBlock.explanation}</p>` : ''}
          </div>
        `;
      }

      if (step.callouts) {
        html += `<div class="space-y-3 pt-2">`;
        step.callouts.forEach(c => {
          let color = 'blue';
          let icon = 'fa-lightbulb';
          if (c.type === 'warning') { color = 'amber'; icon = 'fa-triangle-exclamation'; }
          else if (c.type === 'key') { color = 'indigo'; icon = 'fa-key'; }

          html += `
            <div class="flex items-start gap-3 rounded-xl border border-${color}-200 bg-${color}-50/60 p-4 text-xs sm:text-sm">
              <i class="fa-solid ${icon} text-${color}-600 text-base mt-0.5 shrink-0"></i>
              <div class="space-y-1">
                <span class="font-bold text-${color}-900 block">${c.title}</span>
                <p class="text-slate-700 leading-relaxed">${c.content}</p>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      if (step.checklist && step.checklist.length > 0) {
        html += `
          <div class="mt-8 rounded-xl border border-slate-200 bg-slate-50/70 p-5">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-indigo-600"></i>
                ${step.type === 'checkpoint' ? '교시 실습 완료 점검 체크리스트' : '직접 따라 해보는 실습 체크리스트'}
              </h4>
              <span class="text-[11px] text-slate-500">클릭 시 자동 저장됩니다</span>
            </div>
            <div class="space-y-2">
        `;

        step.checklist.forEach((item, idx) => {
          const itemKey = `${step.id}-${idx}`;
          const isChecked = !!completedChecklist[itemKey];

          html += `
            <label class="flex items-start gap-3 rounded-lg border p-3 text-xs sm:text-sm transition-all cursor-pointer ${
              isChecked ? 'border-emerald-300 bg-emerald-50/60 text-slate-800' : 'border-slate-200 bg-white text-slate-700 hover:border-indigo-300'
            }">
              <input type="checkbox" data-check-key="${itemKey}" class="step-chk-box mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 cursor-pointer" ${isChecked ? 'checked' : ''}>
              <span class="${isChecked ? 'line-through text-slate-500' : 'font-medium'}">${item}</span>
            </label>
          `;
        });

        html += `</div></div>`;
      }

      html += `</div></div>`;
      container.innerHTML = html;

      const copyBtn = document.getElementById('copy-code-btn');
      if (copyBtn && step.codeBlock) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(step.codeBlock.code);
            copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400 font-semibold">복사 완료!</span>';
            setTimeout(() => {
              copyBtn.innerHTML = '<i class="fa-regular fa-copy text-xs"></i><span>코드 복사</span>';
            }, 2000);
          } catch(e) {}
        });
      }

      const chipBtn = document.getElementById('chip-status-btn');
      if (chipBtn) {
        const statuses = [
          { text: '대기 (클릭시 변경)', class: 'bg-slate-100 text-slate-700 border-slate-300' },
          { text: '진행중 (클릭시 변경)', class: 'bg-amber-100 text-amber-800 border-amber-300' },
          { text: '완료 (클릭시 변경)', class: 'bg-emerald-100 text-emerald-800 border-emerald-300' }
        ];
        let currentStatusIdx = 1;
        chipBtn.onclick = () => {
          currentStatusIdx = (currentStatusIdx + 1) % statuses.length;
          const s = statuses[currentStatusIdx];
          document.getElementById('chip-status-text').textContent = s.text;
          chipBtn.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full border text-xs font-semibold ${s.class} transition-all cursor-pointer`;
        };
      }

      const regexInput = document.getElementById('regex-input');
      if (regexInput) {
        const regexFeedback = document.getElementById('regex-feedback');
        regexInput.oninput = () => {
          const val = regexInput.value.trim();
          const valid = /^01[0-9]{8,9}$/.test(val);
          if (valid) {
            regexInput.className = "w-full rounded-lg border border-emerald-400 bg-emerald-50/20 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500";
            regexFeedback.className = "mt-2 text-xs text-emerald-700 flex items-center gap-1.5";
            regexFeedback.innerHTML = '<i class="fa-solid fa-circle-check"></i><span><strong>입력 규칙 통과!</strong> 올바른 10~11자리 휴대폰 번호입니다.</span>';
          } else {
            regexInput.className = "w-full rounded-lg border border-rose-400 bg-rose-50/20 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500";
            regexFeedback.className = "mt-2 text-xs text-rose-700 flex items-center gap-1.5";
            regexFeedback.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i><span><strong>오류 안내:</strong> \'-\' 없이 올바른 10~11자리 휴대폰 번호를 입력해주세요.</span>';
          }
        };
      }

      document.querySelectorAll('.step-chk-box').forEach(box => {
        box.addEventListener('change', () => {
          const key = box.getAttribute('data-check-key');
          completedChecklist[key] = box.checked;
          saveChecklist();
          renderSlide();
          renderSidebar();
        });
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function goToSlide(index) {
      if (index < 0 || index >= ALL_SLIDES.length) return;
      currentSlideIndex = index;
      openAccordionLessonId = ALL_SLIDES[currentSlideIndex].lessonId;
      saveSlideIndex();
      renderSlide();
      renderSidebar();
      document.querySelector('main').scrollTop = 0;
    }

    document.getElementById('header-prev-btn').onclick = () => goToSlide(currentSlideIndex - 1);
    document.getElementById('footer-prev-btn').onclick = () => goToSlide(currentSlideIndex - 1);
    document.getElementById('header-next-btn').onclick = () => goToSlide(currentSlideIndex + 1);
    document.getElementById('footer-next-btn').onclick = () => goToSlide(currentSlideIndex + 1);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToSlide(currentSlideIndex - 1);
      } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        goToSlide(currentSlideIndex + 1);
      }
    });

    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    function toggleSidebar() {
      const isHidden = sidebar.classList.contains('-translate-x-full');
      if (isHidden) {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.remove('hidden');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }
    function closeSidebarOnMobile() {
      if (window.innerWidth < 1024) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }
    document.getElementById('toggle-sidebar-btn').onclick = toggleSidebar;
    document.getElementById('close-sidebar-btn').onclick = toggleSidebar;
    backdrop.onclick = closeSidebarOnMobile;

    document.getElementById('fullscreen-btn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    const modal = document.getElementById('checkpoint-modal');
    function openModal() {
      renderModalContent();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    document.getElementById('open-checkpoints-btn').onclick = openModal;
    document.getElementById('sidebar-checkpoints-btn').onclick = openModal;
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('close-modal-footer-btn').onclick = closeModal;

    function renderModalContent() {
      let total = 0;
      let checked = 0;
      LESSON_DATA.forEach(l => {
        l.steps.forEach(st => {
          st.checklist.forEach((_, idx) => {
            total++;
            if (completedChecklist[`${st.id}-${idx}`]) checked++;
          });
        });
      });
      const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
      document.getElementById('modal-percentage').textContent = `${pct}%`;
      document.getElementById('modal-counts').textContent = `(${checked} / ${total} 항목 완료)`;
      document.getElementById('modal-progress-bar').style.width = `${pct}%`;

      const listContainer = document.getElementById('modal-list-container');
      listContainer.innerHTML = '';

      LESSON_DATA.forEach(lesson => {
        const box = document.createElement('div');
        box.className = "rounded-xl border border-slate-200 p-4 bg-white shadow-2xs space-y-3";
        box.innerHTML = `
          <div class="flex items-center justify-between border-b pb-2">
            <h4 class="text-sm font-bold text-slate-900">${lesson.title}</h4>
            <button class="modal-jump-btn text-xs font-semibold text-indigo-600 hover:underline" data-lesson-id="${lesson.id}">해당 교시로 이동 →</button>
          </div>
        `;

        const stepsWrapper = document.createElement('div');
        stepsWrapper.className = "space-y-4";

        lesson.steps.forEach(st => {
          const stepBlock = document.createElement('div');
          stepBlock.className = "space-y-1.5 pl-1";
          stepBlock.innerHTML = `<div class="text-xs font-semibold text-slate-700 flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-indigo-500"></span><span>${st.stepTitle}</span></div>`;

          const grid = document.createElement('div');
          grid.className = "grid grid-cols-1 gap-1.5 pl-3";

          st.checklist.forEach((chk, idx) => {
            const itemKey = `${st.id}-${idx}`;
            const isChecked = !!completedChecklist[itemKey];

            const label = document.createElement('label');
            label.className = `flex items-start gap-2.5 rounded-lg border p-2 text-xs cursor-pointer ${isChecked ? 'border-emerald-200 bg-emerald-50/50 text-slate-800' : 'border-slate-100 bg-slate-50/40 text-slate-600'}`;
            label.innerHTML = `
              <input type="checkbox" class="modal-chk-box mt-0.5 h-3.5 w-3.5 rounded border-slate-300 text-indigo-600 cursor-pointer" data-check-key="${itemKey}" ${isChecked ? 'checked' : ''}>
              <span class="${isChecked ? 'line-through text-slate-400' : ''}">${chk}</span>
            `;
            grid.appendChild(label);
          });

          stepBlock.appendChild(grid);
          stepsWrapper.appendChild(stepBlock);
        });

        box.appendChild(stepsWrapper);
        listContainer.appendChild(box);
      });

      document.querySelectorAll('.modal-jump-btn').forEach(btn => {
        btn.onclick = () => {
          const lId = parseInt(btn.getAttribute('data-lesson-id'), 10);
          const firstStepIdx = ALL_SLIDES.findIndex(s => s.lessonId === lId);
          if (firstStepIdx !== -1) goToSlide(firstStepIdx);
          closeModal();
        };
      });

      document.querySelectorAll('.modal-chk-box').forEach(box => {
        box.onchange = () => {
          const key = box.getAttribute('data-check-key');
          completedChecklist[key] = box.checked;
          saveChecklist();
          renderModalContent();
          renderSlide();
          renderSidebar();
        };
      });
    }

    document.getElementById('modal-reset-btn').onclick = () => {
      if (confirm('모든 체크리스트를 초기화하시겠습니까?')) {
        completedChecklist = {};
        saveChecklist();
        renderModalContent();
        renderSlide();
        renderSidebar();
      }
    };

    renderSlide();
    renderSidebar();
  </script>
</body>
</html>
